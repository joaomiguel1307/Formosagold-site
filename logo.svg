<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFB800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC8800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#darkGrad)" rx="40"/>
  <polygon points="200,30 350,115 350,285 200,370 50,285 50,115" fill="none" stroke="#FFB800" stroke-width="3" opacity="0.4"/>
  <polygon points="200,75 310,137.5 310,262.5 200,325 90,262.5 90,137.5" fill="url(#goldGrad)"/>
  <polygon points="200,100 290,150 290,250 200,300 110,250 110,150" fill="url(#darkGrad)"/>
  <text x="200" y="245" font-family="Georgia,serif" font-size="130" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">F</text>
  <text x="200" y="358" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">FORMOSAGOLD</text>
  <text x="200" y="385" font-family="monospace" font-size="13" fill="#FFB800" text-anchor="middle" letter-spacing="6" opacity="0.7">FMG</text>
</svg>
